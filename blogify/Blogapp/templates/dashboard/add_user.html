{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row">

    <!-- Sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Side Content -->
    <div class="col-md-9">

        <div class="card border-0 shadow-sm rounded-4 p-4">

            <h4 class="fw-bold mb-4 text-warning" style="letter-spacing: 1px;">
                Add New User
            </h4>

            <form action="{% url 'add_user' %}" method="POST">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" 
                        class="btn btn-warning rounded-pill px-4 mt-3">
                    Create User
                </button>
            </form>

        </div>

    </div>

</div>

{% endblock %}
