{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row">

    <!-- Sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Side Content -->
    <div class="col-md-9">

        <div class="card border-0 shadow-sm rounded-4 p-4">

            <h4 class="fw-bold mb-4 text-warning" style="letter-spacing: 1px;">
                Add New Post
            </h4>

            <form action="{% url 'add_post' %}" 
                  method="POST" 
                  enctype="multipart/form-data">

                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" 
                        class="btn btn-warning rounded-pill px-4 mt-3">
                    Publish Post
                </button>
            </form>

        </div>

    </div>

</div>

{% endblock %}
