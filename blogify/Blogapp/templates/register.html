{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="register-wrapper mt-5 mb-5">

    <div class="card register-card p-4">

        <div class="text-center mb-4">
            <h3 class="register-title">Create Account ✨</h3>
            <p class="text-muted">Join Blogify and start sharing your thoughts</p>
        </div>

        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-warning w-100 register-btn mt-3">
                Register
            </button>
        </form>

        <div class="text-center mt-3">
            <small>
                Already have an account?
                <a href="{% url 'login' %}" class="text-warning fw-bold">
                    Login
                </a>
            </small>
        </div>

    </div>

</div>

{% endblock %}
